<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff login | Samadhan Complaint Desk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin">
<div id="site-header"></div>
<main>
<section class="page-head"><div class="container"><h1>Staff panel</h1><p class="lead">Update the status of complaints filed in this browser.</p></div></section>
<section class="py-5"><div class="container">
 <div id="login" class="row justify-content-center"><div class="col-md-5"><form id="loginForm" class="form-card" novalidate>
  <div id="loginErr" class="alert alert-danger d-none">Wrong password.</div>
  <label class="form-label" for="pass">Password</label><input type="password" class="form-control mb-3" id="pass" required>
  <div class="invalid-feedback mb-2">Enter the password.</div>
  <button class="btn btn-accent">Log in</button></form></div></div>
 <div id="panel" class="d-none">
  <div class="d-flex justify-content-between mb-3"><h2 id="panelCount"></h2><button id="logout" class="btn btn-outline-dark btn-sm align-self-center">Log out</button></div>
  <div id="list"></div>
 </div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
