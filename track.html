<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track status | Samadhan Complaint Desk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="track">
<div id="site-header"></div>
<main>
<section class="page-head"><div class="container"><h1>Track a complaint</h1><p class="lead">Enter the reference ID you received after filing.</p></div></section>
<section class="py-5"><div class="container"><div class="row justify-content-center"><div class="col-lg-8">
 <form id="trackForm" class="form-card mb-4" novalidate>
  <label class="form-label" for="id">Reference ID</label>
  <div class="input-group has-validation">
   <input class="form-control" id="id" placeholder="CMS261122-4821" pattern="CMS[0-9]{6}-[0-9]{4}" required>
   <button class="btn btn-accent">Check status</button>
   <div class="invalid-feedback">Format: CMS261122-4821</div>
  </div>
 </form>
 <div id="result"></div>
</div></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
